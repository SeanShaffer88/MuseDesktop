name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore MuseDesktop.sln

      - name: Build (Release)
        run: dotnet build MuseDesktop.sln -c Release --no-restore

      - name: Test (core logic)
        run: dotnet test tests/MuseDesktop.Core.Tests -c Release --no-build

      - name: Publish app (win-x64, framework-dependent)
        run: >
          dotnet publish src/MuseDesktop/MuseDesktop.csproj
          -c Release -r win-x64 --self-contained false
          -o publish/win-x64

      - name: Stage release folder
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, CHANGELOG.md publish/win-x64/

      - name: Smoke test (construct the real window)
        shell: pwsh
        run: |
          $p = Start-Process publish/win-x64/MuseDesktop.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }
          Write-Host "Smoke test passed"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuseDesktop-win-x64
          path: publish/win-x64
